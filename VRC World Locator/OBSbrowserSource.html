<!DOCTYPE html>
<html>

<head>
    <title>OBS Text Source</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            color: white;
            /* Customize text color */
            font-family: Arial, sans-serif;
            font-size: 24px;
            /* Add any other styling you need */
        }
    </style>
</head>

<body>

    <div id="dynamicText">Loading...</div>
    <div id="dynamicText2nd">Loading...</div>

    <script>
        const filePath = 'VRChat_Current_World.txt';
        const filePath2nd = 'System_Performance_Log.txt';
        let lastContent = '';
        let lastContent2nd = '';

        function getLastLine(text) {
            const lines = text.trimEnd().split('\n');
            return lines[lines.length - 1].trim();
        }

        // Helper function using XMLHttpRequest (works reliably on local file:// protocols in OBS)
        function readLocalFile(path, callback) {
            const xhr = new XMLHttpRequest();
            // Append timestamp to prevent OBS from caching the file read
            xhr.open('GET', path + '?v=' + new Date().getTime(), true);
            xhr.onreadystatechange = function () {
                // status === 0 is valid for successful local file access
                if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 0)) {
                    callback(xhr.responseText);
                }
            };
            xhr.send();
        }

        function updateText() {
            readLocalFile(filePath, function (data) {
                if (data !== lastContent) {
                    document.getElementById('dynamicText').innerText = data;
                    lastContent = data;
                }
            });
        }

        function updateText2nd() {
            readLocalFile(filePath2nd, function (data) {
                const lastLine = getLastLine(data);
                if (lastLine !== lastContent2nd) {
                    document.getElementById('dynamicText2nd').innerText = lastLine;
                    lastContent2nd = lastLine;
                }
            });
        }

        // Check for updates every 1 second (1000 milliseconds)
        setInterval(updateText, 1000);
        setInterval(updateText2nd, 1000);

        // Initial call to display the text immediately
        updateText();
        updateText2nd();
    </script>

</body>

</html>
